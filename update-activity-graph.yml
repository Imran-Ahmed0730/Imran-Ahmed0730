name: Update activity graph

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:        # allows manual run from the Actions tab

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          theme: tokyo-night
          hide_border: true
          area: true
          output_path: dist/activity-graph.svg

      - name: Push SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
